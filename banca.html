<!doctype html>
<meta charset="utf-8" />
<title>Bancada do cenário</title>
<style>
  body { margin: 0; background: #1b2a30; color: #dfe6e2; font: 13px system-ui; }
  h1 { font: 700 12px system-ui; letter-spacing: .14em; text-transform: uppercase; opacity: .55; padding: 12px 14px 2px; margin: 0; }
  canvas { display: block; margin: 0 14px 10px; }
  .nota { padding: 2px 14px 16px; opacity: .55; }
</style>
<div id="saida"></div>
<p class="nota" id="nota"></p>
<script type="module">
  import { prepararCenario, desenharObjeto, desenharBuraco, desenharOleo, desenharPoca, desenharObstaculo, medidasDoObstaculo, memoriaDaFolha } from '/src/game/cenarioSprites.ts'
  import { VARIANTES, TONS, MEIA_LARGURA } from '/src/game/cenarioModel.ts'
  import { rampa } from '/src/game/paleta.ts'
  import { desenharPortico, desenharFaixaDeFundo } from '/src/game/cenarioSprites.ts'
  import { roadProjection, BOTTOM_RATIO, CAR_VIEW_DISTANCE, VIEW_DISTANCE, lateralOffset } from '/src/game/track.ts'
  import { ambientFor, AMBIENT_COUNT } from '/src/game/layout.ts'
  import { drawCar, prepareCar } from '/src/game/carSprites.ts'

  const q = new URLSearchParams(location.search)
  const flora = q.get('flora') ?? 'verde'
  const nevoa = q.get('nevoa') ?? '207,232,245'

  const t0 = performance.now()
  prepararCenario(flora, nevoa)
  const assar = performance.now() - t0

  // Os três tamanhos que importam: sob a bruma, no meio-campo e colado na
  // câmera, onde o objeto é esticado da célula.
  const TAMANHOS = [30, 80, 170]
  const VAO = 16
  const saida = document.getElementById('saida')

  // Uma família por vez: com todas na mesma página, o que interessa fica
  // fora da tela.
  const pedida = q.get('familia')
  for (const familia of Object.keys(VARIANTES).filter((f) => !pedida || f === pedida)) {
    const combos = []
    for (let v = 0; v < VARIANTES[familia]; v += 1) {
      for (let tom = 0; tom < TONS[familia]; tom += 1) combos.push({ v, tom })
    }

    const titulo = document.createElement('h1')
    titulo.textContent = `${familia} — ${combos.length} combinações`
    saida.append(titulo)

    // O passo acompanha a família: a barreira é duas vezes e meia mais larga
    // que alta, e num passo fixo ela invadia a célula da vizinha.
    const passo = Math.max(230, Math.max(...TAMANHOS) * MEIA_LARGURA[familia] * 2 + 40)
    const tela = document.createElement('canvas')
    tela.width = combos.length * passo + VAO * 2
    tela.height = TAMANHOS.reduce((soma, t) => soma + t + 26, 0)
    const ctx = tela.getContext('2d')

    let y = 0
    for (const altura of TAMANHOS) {
      const chao = y + altura + 10
      ctx.fillStyle = altura === 80 ? '#2f6338' : '#3d434b'
      ctx.fillRect(0, y, tela.width, altura + 26)
      let x = VAO + passo / 2
      for (const { v, tom } of combos) {
        // A sombra no chão sai de `desenharObjeto`, e não do sprite: é
        // translúcida, e uma face translúcida composta duas vezes daria cores
        // diferentes. Desenhá-la aqui de novo dobrava a mancha.
        desenharObjeto(ctx, familia, v, tom, x, chao, altura)
        x += passo
      }
      y += altura + 26
    }
    saida.append(tela)
  }

  /**
   * Os obstáculos na pista, antes e depois da régua de perspectiva.
   *
   * A mesma cena duas vezes: pista reta com as faixas de doze metros, os
   * mesmos obstáculos nas mesmas distâncias e o carro no lugar dele. À
   * esquerda, a curva antiga, que dava a cada obstáculo um tamanho próprio da
   * distância; à direita, o tamanho saído da mesma projeção da pista, com as
   * peças deitadas achatando como as faixas em volta delas. As duas usam os
   * mesmos desenhos — só as medidas mudam —, então a diferença que se vê é
   * só a da régua.
   */
  {
    const titulo = document.createElement('h1')
    titulo.textContent = 'obstáculos na pista — antes e depois'
    saida.append(titulo)

    const L = 600
    const A = 338
    const VAO = 14
    const tela = document.createElement('canvas')
    tela.width = L * 2 + VAO
    tela.height = A + 24
    const ctx = tela.getContext('2d')
    ctx.imageSmoothingQuality = 'high'
    const tonsDoAsfalto = rampa('#4a5157')
    const ceu = '#cfe8f5'
    // Do longe para o perto, que é a ordem de profundidade.
    const CENA = [
      ['barrier', 0.42, 196, 2], ['debris', -0.48, 160, 0], ['oleo', 0.12, 128, 0],
      ['pothole', 0.95, 100, 0], ['barrier', -0.52, 76, 3], ['poca', 0.5, 56, 0],
      ['debris', 0.02, 40, 0], ['pothole', -0.95, 27, 0], ['barrier', 0.42, 16, 5],
    ]
    // A curva antiga, só para a comparação: o tamanho vinha da distância por
    // uma conta própria, e as peças deitadas tinham achatamento fixo.
    const medidasAntigas = (kind, lane, distancia, pistaEm) => {
      const aqui = pistaEm(distancia)
      const perto = Math.max(0, 1 - distancia / VIEW_DISTANCE)
      const tamanho = (5 + Math.pow(perto, 1.5) * 48) * Math.max(0.76, L / 620)
      const x = aqui.center + lateralOffset(lane, aqui.roadWidth)
      if (kind === 'barrier') return { kind, x, chao: aqui.y, altura: tamanho * 0.52 }
      if (kind === 'debris') return { kind, x, chao: aqui.y, altura: tamanho * 1.08 }
      const meia = { pothole: 0.5, oleo: 0.9, poca: 0.78 }[kind] * tamanho
      return { kind, x, chao: aqui.y, rx: meia, ry: meia * 0.34 }
    }
    const neutra = { tilt: 0, suspension: 0, steer: 0, boost: 0, jitter: 0, travel: 0, dirt: 0 }
    prepareCar('senna', '')

    const cena = (ox, medir, rotulo) => {
      const pistaEm = (distancia) => {
        const p = roadProjection(distancia, L, A)
        return { center: ox + L / 2, y: p.y, roadWidth: p.roadWidth }
      }
      ctx.save()
      ctx.beginPath()
      ctx.rect(ox, 0, L, A)
      ctx.clip()
      ctx.fillStyle = '#9cc6de'
      ctx.fillRect(ox, 0, L, A)
      ctx.fillStyle = '#2a5a34'
      ctx.fillRect(ox, pistaEm(VIEW_DISTANCE).y, L, A)
      // Grama e asfalto de doze em doze metros, do perto para o longe, pela
      // mesma projeção da corrida.
      let perto = pistaEm(0)
      for (let d = 0.5; d <= VIEW_DISTANCE; d += d < 20 ? 0.5 : d < 80 ? 1 : 2) {
        const longe = pistaEm(d)
        const faixa = Math.floor(d / 12) % 2 === 0
        ctx.fillStyle = faixa ? '#2f6338' : '#2a5a34'
        ctx.fillRect(ox, longe.y, L, Math.max(1, perto.y - longe.y + 1))
        ctx.fillStyle = faixa ? '#4a5157' : '#434a51'
        ctx.beginPath()
        ctx.moveTo(longe.center - longe.roadWidth / 2, longe.y)
        ctx.lineTo(longe.center + longe.roadWidth / 2, longe.y)
        ctx.lineTo(perto.center + perto.roadWidth / 2, perto.y)
        ctx.lineTo(perto.center - perto.roadWidth / 2, perto.y)
        ctx.closePath()
        ctx.fill()
        perto = longe
      }
      for (const [kind, lane, distancia, id] of CENA) {
        desenharObstaculo(ctx, medir(kind, lane, distancia, pistaEm), id, tonsDoAsfalto, ceu)
      }
      const carro = pistaEm(CAR_VIEW_DISTANCE)
      drawCar(ctx, carro.center, carro.y, Math.max(0.76, L / 620), 'senna', neutra)
      ctx.restore()
      ctx.fillStyle = '#e8ecef'
      ctx.font = '12px system-ui, sans-serif'
      ctx.fillText(rotulo, ox + 8, A + 17)
    }
    cena(0, medidasAntigas, 'antes — régua própria de tamanho')
    cena(L + VAO, medidasDoObstaculo, 'depois — na régua da pista')
    saida.append(tela)
  }

  /**
   * Os cinco tipos de obstáculo, do tamanho de longe ao de perto.
   *
   * Ficam juntos e sobre asfalto porque é assim que aparecem: o que importa
   * aqui não é cada um isolado, é se dá para dizer qual é qual no tamanho em
   * que o jogador ainda tem tempo de desviar. Cada linha é um tamanho de
   * referência, com as proporções de jogo entre as peças, e as deitadas
   * aparecem com o achatamento que têm na altura do carro. A perspectiva de
   * verdade — elas achatando ao longe, como as faixas da pista — está na cena
   * de antes e depois, logo acima.
   */
  {
    const titulo = document.createElement('h1')
    titulo.textContent = 'obstáculos — como chegam na pista'
    saida.append(titulo)

    const ASFALTO = ['#3b4147', '#434a51']
    const ASFALTO_TONS = rampa('#4a5157')
    const TAMANHOS = [18, 34, 60, 96, 150]
    const PECAS = [
      ['barreira', (ctx, x, y, t) => desenharObjeto(ctx, 'barreira', 0, 0, x, y, t * 0.52)],
      ['barreira', (ctx, x, y, t) => desenharObjeto(ctx, 'barreira', 1, 0, x, y, t * 0.52)],
      ['cone', (ctx, x, y, t) => desenharObjeto(ctx, 'cone', 0, 0, x, y, t * 1.08)],
      ['buraco', (ctx, x, y, t) => desenharBuraco(ctx, x, y, t * 0.5, t * 0.17, ASFALTO_TONS)],
      ['óleo', (ctx, x, y, t) => desenharOleo(ctx, x, y, t * 0.9, t * 0.306)],
      ['poça', (ctx, x, y, t) => desenharPoca(ctx, x, y, t * 0.78, t * 0.265, ASFALTO_TONS, '#e2a46a')],
    ]

    const COLUNA = 290
    const tela = document.createElement('canvas')
    tela.width = PECAS.length * COLUNA
    tela.height = TAMANHOS.reduce((soma, t) => soma + t + 40, 0)
    const ctx = tela.getContext('2d')

    let y = 0
    TAMANHOS.forEach((tamanho, linha) => {
      const altura = tamanho + 40
      ctx.fillStyle = ASFALTO[linha % 2]
      ctx.fillRect(0, y, tela.width, altura)
      // Faixa central da pista, para o obstáculo não flutuar num cinza liso.
      ctx.fillStyle = '#c8ccc4'
      ctx.fillRect(0, y + altura - 6, tela.width, 2)
      PECAS.forEach(([, desenhar], i) => {
        desenhar(ctx, i * COLUNA + COLUNA / 2, y + altura - 12, tamanho)
      })
      y += altura
    })
    saida.append(tela)
  }

  /**
   * A poça nos quatro ambientes.
   *
   * A água dela é o céu do lugar — é o que a faz ler como água e não como
   * mancha de tinta, e é a única peça do jogo cuja cor vem do fundo. Esta
   * tira existe para conferir que ela se separa do asfalto nos quatro, e não
   * só no que estava aberto quando foi desenhada.
   *
   * Os ambientes saem de `ambientFor`, varrendo sementes até achar os quatro:
   * a tabela não é exportada, e copiar as cores aqui só criaria uma segunda
   * versão delas para ficar desencontrada da primeira.
   */
  {
    const titulo = document.createElement('h1')
    titulo.textContent = 'poça — a água é o céu do lugar'
    saida.append(titulo)

    const ambientes = []
    for (let semente = 0; ambientes.length < AMBIENT_COUNT && semente < 400; semente += 1) {
      const a = ambientFor(semente)
      if (!ambientes.some((outro) => outro.nome === a.nome)) ambientes.push(a)
    }

    const COLUNA = 200
    const ALTURA = 130
    const tela = document.createElement('canvas')
    tela.width = ambientes.length * COLUNA
    tela.height = ALTURA + 22
    const ctx = tela.getContext('2d')
    ctx.font = '11px system-ui, sans-serif'
    ambientes.forEach((ambiente, i) => {
      const x = i * COLUNA
      // Fundo com as duas listras de asfalto da pista daquele ambiente.
      ctx.fillStyle = ambiente.asfaltoEscuro
      ctx.fillRect(x, 0, COLUNA, ALTURA)
      ctx.fillStyle = ambiente.asfaltoClaro
      ctx.fillRect(x, ALTURA / 2, COLUNA, ALTURA / 2)
      desenharPoca(ctx, x + COLUNA / 2, ALTURA - 24, 68.6, 23.3, rampa(ambiente.asfaltoClaro), ambiente.ceuBaixo)
      ctx.fillStyle = '#e8ecef'
      ctx.fillText(`${ambiente.nome} · ${ambiente.lugar}`, x + 8, ALTURA + 15)
    })
    saida.append(tela)
  }

  /**
   * Tira de pórticos, da distância até depois de a câmera passar por baixo.
   *
   * É a conferência do risco que o plano aponta: a projeção trava em
   * `ahead = 0`, e um arco de tela cheia cortado ali apagaria de um quadro
   * para o outro. Aqui dá para ver ele subir e dissolver em vez de piscar.
   */
  {
    const titulo = document.createElement('h1')
    titulo.textContent = 'pórtico — de 120 m até a vaga em que ele é cortado'
    saida.append(titulo)

    const ALTURA = 210
    const LARGURA = 128
    const AHEADS = [120, 80, 50, 30, 18, 10, 4, 0, 20]
    const tela = document.createElement('canvas')
    tela.width = AHEADS.length * LARGURA
    tela.height = ALTURA
    const ctx = tela.getContext('2d')
    AHEADS.forEach((ahead, i) => {
      ctx.save()
      ctx.beginPath()
      ctx.rect(i * LARGURA, 0, LARGURA, ALTURA)
      ctx.clip()
      ctx.fillStyle = i % 2 ? '#2b3a42' : '#31424a'
      ctx.fillRect(i * LARGURA, 0, LARGURA, ALTURA)
      const proj = roadProjection(ahead, LARGURA, ALTURA / BOTTOM_RATIO)
      // A última célula mostra o pórtico da chegada, com o quadriculado.
      const chegada = i === AHEADS.length - 1
      desenharPortico(ctx, { ...proj, center: i * LARGURA + LARGURA / 2 }, i % 3, 1, chegada)
      ctx.fillStyle = '#9fb0ae'
      ctx.font = '11px system-ui'
      ctx.fillText(chegada ? 'chegada' : `${ahead} m`, i * LARGURA + 8, 16)
      ctx.restore()
    })
    saida.append(tela)
  }

  // A faixa de meio-campo, nos quatro lugares.
  {
    const titulo = document.createElement('h1')
    titulo.textContent = 'faixa de fundo — campo · cidade · montanha · deserto'
    saida.append(titulo)
    const LUGARES = [
      ['campo', '#2a4433'],
      ['cidade', '#33414c'],
      ['montanha', '#2a4247'],
      ['deserto', '#6a4f33'],
    ]
    const ALTURA = 96
    const tela = document.createElement('canvas')
    tela.width = 1160
    tela.height = ALTURA * LUGARES.length
    const ctx = tela.getContext('2d')
    LUGARES.forEach(([lugar, cor], i) => {
      const base = (i + 1) * ALTURA
      ctx.fillStyle = i % 2 ? '#3c5a6a' : '#44647a'
      ctx.fillRect(0, base - ALTURA, tela.width, ALTURA)
      // Duas passadas com deslocamentos diferentes mostram que a tira emenda.
      desenharFaixaDeFundo(ctx, lugar, cor, tela.width, base, ALTURA * 0.82, i * 260)
      ctx.fillStyle = '#dfe6e2'
      ctx.font = '11px system-ui'
      ctx.fillText(lugar, 8, base - ALTURA + 14)
    })
    saida.append(tela)
  }

  /**
   * O carro nas poses que a fase 7 acrescentou.
   *
   * O painel do navegador desenha em rajadas e a simulação tem passo travado,
   * então dirigir até a grama para ver a terra não é uma verificação que se
   * consiga fazer aqui. As poses são postas à mão, com os valores que a
   * corrida produz nos extremos, e o desenho é o mesmo `drawCar` do jogo.
   *
   * O que olhar: a sombra fica no chão enquanto o corpo sobe, desce e rola; a
   * terra cai sobre o carro, e não no asfalto ao lado, também nas curvas.
   */
  {
    const titulo = document.createElement('h1')
    titulo.textContent = 'carro — sombra no chão, terra na carroceria'
    saida.append(titulo)

    const neutra = { tilt: 0, suspension: 0, steer: 0, boost: 0, jitter: 0, travel: 0, dirt: 0 }
    const POSES = [
      ['neutro', neutra],
      ['sujo', { ...neutra, dirt: 1 }],
      ['afundado', { ...neutra, suspension: 0.06 }],
      ['leve', { ...neutra, suspension: -0.12 }],
      ['curva à dir. suja', { ...neutra, steer: 1, tilt: 0.095, dirt: 1 }],
      ['curva à esq. suja', { ...neutra, steer: -1, tilt: -0.095, dirt: 1 }],
    ]
    const ESCALA = 2.4
    const COLUNA = 190
    const ALTURA = 230
    const tela = document.createElement('canvas')
    tela.width = POSES.length * COLUNA
    tela.height = ALTURA + 22
    const ctx = tela.getContext('2d')
    ctx.imageSmoothingQuality = 'high'
    prepareCar('senna', '')
    POSES.forEach(([nome, pose], i) => {
      const x = i * COLUNA
      ctx.fillStyle = i % 2 ? '#3b4147' : '#434a51'
      ctx.fillRect(x, 0, COLUNA, ALTURA)
      // Linha do chão, para ver a sombra atravessando-a.
      const chao = 150
      ctx.fillStyle = '#5b646c'
      ctx.fillRect(x, chao + 20 * ESCALA, COLUNA, 1)
      drawCar(ctx, x + COLUNA / 2, chao, ESCALA, 'senna', pose)
      ctx.fillStyle = '#e8ecef'
      ctx.font = '11px system-ui, sans-serif'
      ctx.fillText(nome, x + 8, ALTURA + 15)
    })
    saida.append(tela)
  }

  document.getElementById('nota').textContent =
    `assar ${assar.toFixed(1)} ms · folha ${(memoriaDaFolha() / 1048576).toFixed(2)} MB`
</script>
